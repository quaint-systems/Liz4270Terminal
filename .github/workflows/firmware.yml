name: firmware

# Builds the UF2 and runs the host tests on relevant pull requests.
# A version tag also builds the user guide PDFs and publishes the release.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - firmware/**
      - tools/sim/**
      - tools/manual/**
      - docs/manual/**
      - docs/keymaps/**
      - LICENSE
      - LICENSES/**
      - NOTICE
      - .github/workflows/firmware.yml
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi
      ARM_TOOLCHAIN_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1
      ARM_TOOLCHAIN_SHA256: 563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Fetch pico-sdk, TinyUSB and Pico-PIO-USB
        run: |
          git submodule update --init --depth 1 firmware/pico-sdk
          git -C firmware/pico-sdk submodule update --init --depth 1 lib/tinyusb
          git submodule update --init --depth 1 firmware/Pico-PIO-USB

      - name: Cache the Arm toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/arm-toolchain
          key: ${{ env.ARM_TOOLCHAIN }}

      - name: Download the Arm toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/toolchain.tar.xz" "$ARM_TOOLCHAIN_URL/$ARM_TOOLCHAIN.tar.xz"
          echo "$ARM_TOOLCHAIN_SHA256  $RUNNER_TEMP/toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-toolchain
          tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C ~/arm-toolchain --strip-components=1

      - name: Set up the tools
        run: |
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"
          # The SDK builds picotool once into this directory and reuses it.
          echo "PICOTOOL_FETCH_FROM_GIT_PATH=$HOME/picotool" >> "$GITHUB_ENV"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Cache picotool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/picotool
          key: picotool-${{ hashFiles('firmware/pico-sdk/pico_sdk_version.cmake') }}

      - name: Build
        working-directory: firmware
        run: |
          arm-none-eabi-gcc --version
          cmake --preset liz4270
          cmake --build --preset liz4270
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            grep -Fx "#define LIZ_VERSION \"${GITHUB_REF_NAME#v}\"" build/liz4270/generated/liz_version.h
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liz4270-uf2
          path: firmware/build/liz4270/liz4270.uf2
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  simulator:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the simulator tests
        run: |
          python3 -m venv "$RUNNER_TEMP/sim-venv"
          "$RUNNER_TEMP/sim-venv/bin/python" -m pip install -r tools/sim/requirements.txt
          "$RUNNER_TEMP/sim-venv/bin/python" -m unittest discover -s tools/sim

  manual:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPST_VERSION: '0.15.1'
      TYPST_TARGET: typst-x86_64-unknown-linux-musl
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
      OEC_COMMIT: 3c5e812f6d2c0321e6c443dd4ed9590b7611c58a
    outputs:
      tag-object: ${{ steps.tag.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The manual looks up the commit where its edition was declared.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag
        if: github.event_name == 'push'
        id: tag
        run: |
          if [[ $(git cat-file -t "$GITHUB_REF") != tag ]]; then
            echo "::error::$GITHUB_REF_NAME must be an annotated tag. See docs/versions.md."
            exit 1
          fi
          echo "object=$(git rev-parse "$GITHUB_REF")" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        run: |
          archive="$RUNNER_TEMP/$TYPST_TARGET.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/$TYPST_TARGET.tar.xz"
          echo "$TYPST_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" "$TYPST_TARGET/typst"
          echo "$RUNNER_TEMP/$TYPST_TARGET" >> "$GITHUB_PATH"

      - name: Install manual dependencies
        run: |
          oec="$RUNNER_TEMP/oec-tcp"
          git init "$oec"
          git -C "$oec" fetch --depth 1 https://github.com/hanshuebner/oec-tcp.git "$OEC_COMMIT"
          git -C "$oec" checkout --detach FETCH_HEAD
          python3 -m venv "$RUNNER_TEMP/manual-venv"
          "$RUNNER_TEMP/manual-venv/bin/python" -m pip install -r "$oec/requirements.txt" -r tools/sim/requirements.txt

      - name: Run the user guide tests
        run: |
          PYTHONPATH="$RUNNER_TEMP/oec-tcp" "$RUNNER_TEMP/manual-venv/bin/python" -m unittest discover -s tools/manual

      - name: Build the US Letter and A4 user guides
        if: github.event_name == 'push'
        run: |
          PYTHONPATH="$RUNNER_TEMP/oec-tcp" "$RUNNER_TEMP/manual-venv/bin/python" tools/manual/build.py --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: liz4270-user-guides
          path: build/manual/liz4270-users-guide-*.pdf
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' && !github.event.deleted
    needs: [build, simulator, manual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liz4270-uf2
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liz4270-user-guides
          path: release

      - name: Publish the GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_TAG_OBJECT: ${{ needs.manual.outputs.tag-object }}
        run: |
          firmware="liz4270-$GITHUB_REF_NAME.uf2"
          mv liz4270.uf2 "$firmware"
          manuals=(liz4270-users-guide-*-letter.pdf liz4270-users-guide-*-a4.pdf)
          if [[ ${#manuals[@]} != 2 || ! -s "$firmware" || ! -s "${manuals[0]}" || ! -s "${manuals[1]}" ]]; then
            echo '::error::Expected a UF2 image and one user guide PDF for each paper size.'
            exit 1
          fi
          sha256sum "$firmware" "${manuals[@]}" > SHA256SUMS

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$tag_object" != "$BUILT_TAG_OBJECT" ]]; then
            echo "::error::$GITHUB_REF_NAME changed after the build."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Liz4270 ${GITHUB_REF_NAME#v}" \
            "$firmware" "${manuals[@]}" SHA256SUMS
